spring:
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin

  jms:
    listener:
      auto-startup: true
      acknowledge-mode: auto

  h2:
    console:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    com.jsalva.trainerworkload: DEBUG