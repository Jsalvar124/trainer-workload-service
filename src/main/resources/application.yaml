server:
  port: 8081  # Different from main service (8080)

spring:
  application:
    name: trainer-workload-service
  # ActiveMQ Configuration
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  # MongoDB Configuration
  data:
    mongodb:
      host: localhost
      port: 27017
      database: trainer_workload
      username: admin
      password: password
      authentication-database: admin

# Logging Configuration
logging:
  level:
    com.jsalva.trainerworkload: DEBUG
    org.springframework.security: DEBUG
