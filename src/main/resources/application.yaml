server:
  port: 8081  # Different from Eureka (8761) and main service (8080)

spring:
  application:
    name: trainer-workload-service

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:trainerworkloaddb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Recreates schema on restart (in-memory)
    show-sql: true

  # H2 Console (optional, for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    com.jsalva.trainerworkload: DEBUG
    org.springframework.security: DEBUG

# Environment variables
app:
  data:
    sync-on-startup: true

main:
  service:
    url: http://localhost:8080